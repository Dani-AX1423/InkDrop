services:
  - type: web
    name: inkdrop-server
    runtime: node
    # Free tier spins down after 15 min of inactivity (cold start ~30-50s).
    # Upgrade to 'starter' if persistent zero-latency connections are required.
    plan: free
    buildCommand: npm install && npm run build --workspace=apps/server
    startCommand: npm run start --workspace=apps/server
    healthCheckPath: /health
    envVars:
      - key: PORT
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
